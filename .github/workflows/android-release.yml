name: Android release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk

      - name: Build architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: private-agent-android-apk
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PrivateAgent Mobile Automation (Latest Release)' }}
          make_latest: true
          body: |
            ## 📱 PrivateAgent Mobile Automation Release

            ### What's New in v1.0.10:
            - 🛑 **Single-Step Vision Deactivation**: When vision activates on-demand (when stuck, screen unchanged, or requested for visual inspection), it runs strictly for that specific step. The moment that step is fulfilled/executed, vision immediately turns off and does NOT stay on for the rest of the task, reverting to fast, low-token accessibility text.
            - 🔒 **Total Non-Vision Model Lockout**: Vision is strictly disabled and blocked for models that do not support it (e.g. DeepSeek-Chat, GLM-5.2, Llama 3.3, Mistral, GPT-3.5). The UI eye icon is locked/greyed with feedback toast, settings switch is disabled, and the network layer guarantees no image payloads are dispatched to text-only endpoints.
            - 👁️ **Hybrid Vision-on-Demand**: Vision automatically activates on-demand whenever the agent gets stuck, when an action fails, when the screen content does not change, or when the task naturally requests visual understanding.
            - ⚡ **Adaptive Event-Driven Settling**: Steps advance as soon as Android UI animations and content settle (often in 200-300ms), speeding up automation up to 3x.
            - 🐰 **Full OpenRouter Space Bunny Support**: Multimodal vision enabled for stealth/space-bunny-alpha, union-alpha, qvq, and all stealth/VL models.
            - 🔒 **Zero Data Retention**: Ephemeral in-memory screen analysis - screenshots are analyzed and discarded immediately.
            - 🔇 **Silent Operation**: Text-to-Speech (TTS) fully disabled for quiet background automation.
            - 🏷️ **Version Badge**: Explicitly shows 'v1.0.10' in Settings and the Side Drawer.

            ### 📲 Direct APK Downloads for your Android Phone:
            - **[Download ARM64 APK (Recommended for Pixel 7 & Modern Phones)](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/app-arm64-v8a-release.apk)**
            - **[Download Universal APK](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/app-universal-release.apk)**

            ---
            *Signed with release debug certificate for direct installation.*
          files: |
            dist/app-universal-release.apk
            dist/app-arm64-v8a-release.apk
            dist/app-armeabi-v7a-release.apk
            dist/app-x86_64-release.apk
            dist/SHA256SUMS.txt
