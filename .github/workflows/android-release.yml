name: Android release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk

      - name: Build architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: private-agent-android-apk
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PrivateAgent Mobile Automation (Latest Release)' }}
          make_latest: true
          body: |
            ## 📱 PrivateAgent Mobile Automation Release

            ### What's New in v1.0.6:
            - 👁️ **Vision Mode Toggle**: Toggle between visual screen understanding (multimodal screenshots) and accessibility hierarchy text dumps.
            - 🔒 **Zero Data Retention**: Ephemeral in-memory screen analysis - screenshots are analyzed and discarded immediately.
            - 🔇 **Silent Operation**: Text-to-Speech (TTS) fully disabled for quiet background automation.
            - 🏷️ **Version Badge**: Explicitly shows 'v1.0.6' in Settings and the Side Drawer so you know you're running the right build.

            ### 📲 Direct APK Downloads for your Android Phone:
            - **[Download ARM64 APK (Recommended for Pixel 7 & Modern Phones)](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/app-arm64-v8a-release.apk)**
            - **[Download Universal APK](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/app-universal-release.apk)**

            ---
            *Signed with release debug certificate for direct installation.*
          files: |
            dist/app-universal-release.apk
            dist/app-arm64-v8a-release.apk
            dist/app-armeabi-v7a-release.apk
            dist/app-x86_64-release.apk
            dist/SHA256SUMS.txt
